name: Validate Codex Plugin

on:
  pull_request:
    paths:
      - '.codex-plugin/**'
      - 'skills/**'
      - 'scripts/validate-codex-plugin.mjs'
      - '.github/workflows/validate-codex-plugin.yml'
  push:
    branches: [main]
    paths:
      - '.codex-plugin/**'
      - 'skills/**'
      - 'scripts/validate-codex-plugin.mjs'
      - '.github/workflows/validate-codex-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Codex/OpenAI package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-codex-plugin.mjs .

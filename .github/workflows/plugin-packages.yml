name: Plugin packages

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/plugin-packages.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - '.github/workflows/plugin-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-claude:
    name: Validate Claude plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.283
      - run: claude plugin validate .claude-plugin/plugin.json --strict --json
      - run: claude plugin validate .claude-plugin/marketplace.json --strict --json

  validate-codex:
    name: Validate Codex plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/validate-codex-plugin.mjs .

  release:
    name: Package plugin releases
    needs: [validate-claude, validate-codex]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/package-plugins.mjs release
      - run: |
          cd release
          zip -rq ../dependency-upgrade-audit-claude-${{ github.ref_name }}.zip claude
          zip -rq ../dependency-upgrade-audit-codex-${{ github.ref_name }}.zip codex
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: dependency-upgrade-audit-*.zip
          if-no-files-found: error

  publish:
    name: Publish plugin releases
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-packages
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*.zip

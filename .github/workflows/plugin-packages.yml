name: Plugin packages

on:
  pull_request:
    paths:
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'Containerfile'
      - '.containerignore'
      - '.github/workflows/plugin-packages.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - 'skills/**'
      - 'scripts/**'
      - 'Containerfile'
      - '.containerignore'
      - '.github/workflows/plugin-packages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-claude:
    name: Validate Claude plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes buildah
      - run: sudo buildah build --target validate-claude --tag plugin-claude-validation .

  validate-codex:
    name: Validate Codex plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes buildah
      - run: sudo buildah build --target validate-codex --tag plugin-codex-validation .

  release:
    name: Package plugin releases
    needs: [validate-claude, validate-codex]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install --yes buildah
      - run: |
          sudo buildah build --target package --build-arg RELEASE_VERSION=${{ github.ref_name }} --tag plugin-packages .
          container=$(sudo buildah from plugin-packages)
          mountpoint=$(sudo buildah mount "$container")
          sudo cp "$mountpoint"/release/*.zip .
          sudo buildah umount "$container"
          sudo buildah rm "$container"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-packages
          path: dependency-upgrade-audit-*.zip
          if-no-files-found: error

  publish:
    name: Publish plugin releases
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-packages
          path: packages
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/*.zip
